name: Android APK

# Builds an installable APK on GitHub's runners and attaches it to the run.
#
# Why here: the sandbox this project is developed in has no JDK, no Android SDK
# and cannot reach services.gradle.org, dl.google.com or repo.maven.apache.org,
# and EAS Build (api.expo.dev) is unreachable from it too. GitHub's ubuntu
# runners have the Android SDK preinstalled and unrestricted network access, so
# this is the build path that actually works.
#
# The APK is signed with the standard Android *debug* keystore (Expo's prebuild
# template wires release builds to it). That is fine for sideloading and testing
# — Android accepts it — but it is NOT a Play Store key, and installing a later
# build over this one requires the same key. Swap in a real keystore before you
# ever publish.

on:
  push:
    branches:
      - arena/6bb475ae-app-appwrite
      - main
  workflow_dispatch:
    inputs:
      architectures:
        description: "ABIs to build (comma separated)"
        required: false
        default: "arm64-v8a,armeabi-v7a"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: "1"
  CI: "1"
  # Gradle's expo-constants task warns without it, and a release build is what
  # this is anyway.
  NODE_ENV: production

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      # npm, not pnpm: React Native's Gradle autolinking expects a flat,
      # hoisted node_modules. pnpm's symlinked layout is a known source of
      # flaky native builds, and an APK that fails to link helps nobody.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install the Android SDK packages this project pins
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER"; exit 1
          fi
          # compileSdk 35, build-tools 35.0.0 and NDK 26.1.10909125 come from
          # android/build.gradle; Reanimated compiles C++ here, so the NDK and
          # CMake have to be present and matching.
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1" 2>&1 | tail -5

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      # Bundle the JS before Gradle does, on purpose.
      #
      # Metro is where this build broke the first time: Gradle's
      # `createBundleReleaseJsAndAssets` reported only the task name, while the
      # real cause (a package Metro could not resolve) was buried in the log.
      # Running it standalone fails fast with a small, readable log — and it also
      # proves the JS compiles for Android before 10 minutes of native compiling.
      - name: Bundle the JavaScript for Android
        run: |
          set -o pipefail
          npx expo export:embed \
            --entry-file node_modules/expo-router/entry.js \
            --platform android \
            --dev false \
            --bundle-output /tmp/js/index.android.bundle \
            --assets-dest /tmp/js-assets 2>&1 | tail -25

      - name: Build the APK
        working-directory: android
        env:
          # Two ABIs, not four: x86/x86_64 only matter for emulators, and
          # dropping them roughly halves the native compile time.
          ARCHS: ${{ github.event.inputs.architectures || 'arm64-v8a,armeabi-v7a' }}
        run: |
          set -o pipefail
          chmod +x gradlew
          # RN 0.76 is Kotlin- and C++-heavy; the template's 2 GB heap is tight
          # for a release build. Editing the property is more predictable than
          # passing -D on the command line.
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' gradle.properties
          ./gradlew assembleRelease \
            --no-daemon \
            -PreactNativeArchitectures="$ARCHS" 2>&1 | tee gradle.log

      # The build log is not readable from the development sandbox (GitHub serves
      # it from a host that is not reachable there), so the failure is echoed into
      # check annotations, which are readable through the API.
      - name: Report the Gradle failure
        if: failure()
        working-directory: android
        run: |
          if [ ! -f gradle.log ]; then echo "gradle.log missing"; exit 0; fi
          echo "── log size: $(wc -l < gradle.log) lines ──"
          for label in "What went wrong" "Execution failed" "FAILURE:"; do
            echo "::group::$label"
            grep -n -A 18 "$label" gradle.log | head -60 || true
            echo "::endgroup::"
          done
          # Emit a slice of the log as an annotation. `offset` lines forward from
          # the match, so a failure reason is captured with its context rather
          # than as a lone header line (which is exactly how the first run
          # reported nothing useful).
          slice() {
            local title="$1" pattern="$2" after="${3:-0}" lines="${4:-28}"
            local body
            body="$(awk -v pat="$pattern" -v after="$after" -v want="$lines" '
              $0 ~ pat { grab = after + want }
              grab > 0 { print; grab-- }
            ' gradle.log | head -n 200 | sed 's/%/%25/g' | tr '\n' '|' | sed 's/|/%0A/g' | cut -c1-3400)"
            if [ -n "$body" ]; then echo "::error title=$title::$body"; fi
          }
          slice "What went wrong" "What went wrong" 22
          slice "Caused by" "Caused by:" 8
          slice "Failed task" "> Task .*FAILED" 0 4
          slice "Build errors" "(error:|Error:|e: |Unresolved reference|Could not resolve|Could not find|No matching|be found|cannot)" 4
          slice "Log tail" "^BUILD FAILED" 40

      - name: Collect and verify the APK
        id: apk
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "Gradle produced no APK"; exit 1; fi
          NAME="eternalz-r${GITHUB_RUN_NUMBER}-$(echo "$GITHUB_SHA" | cut -c1-7).apk"
          cp "$APK" "$NAME"
          # Fail the build if the artifact would not install: a "successful"
          # Gradle run can still emit something unsigned, empty, or missing dex.
          node scripts/verify-apk.mjs "$NAME"
          echo "path=$NAME" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$NAME" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: eternalz-apk-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

name: Android APK

# Builds an installable APK on GitHub's runners and attaches it to the run.
#
# Why here: the sandbox this project is developed in has no JDK, no Android SDK
# and cannot reach services.gradle.org, dl.google.com or repo.maven.apache.org,
# and EAS Build (api.expo.dev) is unreachable from it too. GitHub's ubuntu
# runners have the Android SDK preinstalled and unrestricted network access, so
# this is the build path that actually works.
#
# The APK is signed with Android's standard *debug* keystore (Expo's prebuild
# template wires release builds to it). Android accepts that for sideloading, so
# it installs fine for testing — but it is NOT a Play Store key, and a future
# build must use the same key to upgrade over an existing install. Swap in a real
# keystore before publishing.
#
# Every stage tees its output to a log file and the final reporter turns the
# useful part into check annotations. That matters because the runner's raw logs
# are served from a host the development sandbox cannot reach, so a bare
# "Process completed with exit code 1" would otherwise be all that is visible.

on:
  push:
    branches:
      - arena/6bb475ae-app-appwrite
      - main
    # Documentation alone should not spend 14 minutes compiling C++.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      architectures:
        description: "ABIs to build (comma separated)"
        required: false
        default: "arm64-v8a,armeabi-v7a"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: "1"
  CI: "1"

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      # npm, not pnpm: React Native's Gradle autolinking expects a flat, hoisted
      # node_modules, and pnpm's symlinked layout is a known source of flaky
      # native builds.
      #
      # --include=dev is deliberate. Config plugins run at prebuild time, and a
      # stray NODE_ENV=production makes npm skip devDependencies — which silently
      # broke this build once by removing @expo/config-plugins.
      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Install the Android SDK packages this project pins
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER"; exit 1
          fi
          # compileSdk 35, build-tools 35.0.0 and NDK 26.1.10909125 come from
          # android/build.gradle; Reanimated compiles C++ here, so the NDK and
          # CMake must be present and matching.
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1" 2>&1 | tail -5

      - name: Generate the native Android project
        run: |
          set -o pipefail
          npx expo prebuild --platform android --no-install 2>&1 | tee prebuild.log

      # Bundle the JS before Gradle does, on purpose.
      #
      # Metro is where this build first broke: Gradle's
      # createBundleReleaseJsAndAssets reported only the task name while the
      # cause (a package Metro could not resolve) was buried. Running it
      # standalone fails fast with a small, readable log — and proves the JS
      # compiles before ten minutes of native compiling.
      - name: Bundle the JavaScript for Android
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          npx expo export:embed \
            --entry-file node_modules/expo-router/entry.js \
            --platform android \
            --dev false \
            --bundle-output /tmp/js/index.android.bundle \
            --assets-dest /tmp/js-assets 2>&1 | tee bundle.log | tail -8

      - name: Build the APK
        working-directory: android
        env:
          NODE_ENV: production
          # Two ABIs, not four: x86/x86_64 only matter for emulators, and
          # dropping them roughly halves the native compile time.
          ARCHS: ${{ github.event.inputs.architectures || 'arm64-v8a,armeabi-v7a' }}
        run: |
          set -o pipefail
          chmod +x gradlew
          # RN 0.76 is Kotlin- and C++-heavy; the template's 2 GB heap is tight
          # for a release build. Editing the property is more predictable than
          # passing -D on the command line.
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' gradle.properties
          ./gradlew assembleRelease \
            --no-daemon \
            -PreactNativeArchitectures="$ARCHS" 2>&1 | tee gradle.log

      - name: Collect and verify the APK
        id: apk
        run: |
          exec > >(tee collect.log) 2>&1
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "Gradle produced no APK. Contents of the outputs tree:"
            find android/app/build/outputs -type f 2>/dev/null | head -40 || true
            exit 1
          fi
          echo "Found $APK ($(du -h "$APK" | cut -f1))"
          NAME="eternalz-r${GITHUB_RUN_NUMBER}-$(echo "$GITHUB_SHA" | cut -c1-7).apk"
          cp "$APK" "$NAME"
          # Fail the build if the artifact would not install: a "successful"
          # Gradle run can still emit something unsigned, empty, or missing dex.
          node scripts/verify-apk.mjs "$NAME"
          echo "path=$NAME" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$NAME" | cut -f1)" >> "$GITHUB_OUTPUT"

      # Ground truth, from Android's own tools rather than a hand-rolled parser.
      #
      # aapt2 has to parse the binary manifest to print anything, so it is also a
      # direct test of the one thing that produces "There was a problem parsing
      # the package": a manifest Android cannot read. apksigner reports which
      # signature schemes are present, which matters on older devices. The sha256
      # lets a download be checked after it reaches a phone, and the key lines are
      # emitted as annotations because the runner's raw logs are not reachable
      # from the development sandbox.
      - name: Inspect the APK with Android's build tools
        run: |
          exec > >(tee inspect.log) 2>&1
          set -uo pipefail
          APK="$(ls eternalz-*.apk | head -1)"
          BT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0"
          [ -x "$BT/aapt2" ] || { echo "aapt2 not found at $BT"; exit 1; }

          echo "APK:    $APK"
          echo "bytes:  $(stat -c%s "$APK")"
          SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          echo "sha256: $SHA"

          echo
          echo "── archive integrity (unzip -t) ──"
          unzip -t "$APK" 2>&1 | tail -2

          echo
          echo "── apksigner verify --verbose --print-certs ──"
          "$BT/apksigner" verify --verbose --print-certs "$APK" 2>&1 | sed -n '1,25p'
          VERIFIED="$("$BT/apksigner" verify --verbose "$APK" 2>&1 | grep -E '^Verified using' | tr '\n' '|')"

          echo
          echo "── aapt2 dump badging ──"
          "$BT/aapt2" dump badging "$APK" 2>&1 | sed -n '1,14p'
          BADGE="$("$BT/aapt2" dump badging "$APK" 2>&1 \
            | grep -E '^(package|sdkVersion|targetSdkVersion|native-code|native-code|application-label)' \
            | tr '\n' '|')"

          echo "::notice title=APK sha256::$SHA"
          echo "::notice title=APK badging::$BADGE"
          echo "::notice title=APK signatures::$VERIFIED"

      # A direct .apk download, because Artifacts are always served as a ZIP —
      # and extracting or renaming that on a phone is the most common cause of
      # "There was a problem parsing the package". The asset name is fixed so the
      # URL stays the same for every build:
      #
      #   https://github.com/WaquarShaikh5555/app-appwrite/releases/latest/download/eternalz.apk
      - name: Publish the stable .apk download
        run: |
          set -euo pipefail
          APK="$(ls eternalz-*.apk | head -1)"
          cp "$APK" eternalz.apk
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest \
              --title "Eternalz — Android APK" \
              --notes "Sideload build, rebuilt automatically on every push to the build branch. Signed with Android's debug keystore, which is fine for testing but is not a Play Store key. Tap the APK on your phone to install; Android will ask once to allow installs from that source."
          fi
          # Replace the existing asset so the URL always serves the newest build.
          gh release upload android-latest eternalz.apk --clobber
          echo "Published. Download:"
          echo "  https://github.com/WaquarShaikh5555/app-appwrite/releases/latest/download/eternalz.apk"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: eternalz-apk-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # Last step on purpose, and deliberately without a working-directory: an
      # earlier version ran inside android/ and died there when prebuild had not
      # created the directory, hiding the real error behind a shell startup
      # failure.
      - name: Report what failed
        if: failure()
        run: |
          emit() {
            local title="$1" body="$2"
            [ -n "$body" ] || return 0
            printf '::error title=%s::%s\n' "$title" \
              "$(printf '%s' "$body" | sed 's/%/%25/g' | tr '\n' '|' | sed 's/|/%0A/g' | cut -c1-3400)"
          }
          slice() {
            local file="$1" pattern="$2" after="${3:-0}" lines="${4:-28}"
            awk -v pat="$pattern" -v after="$after" -v want="$lines" '
              $0 ~ pat { grab = after + want }
              grab > 0 { print; grab-- }
            ' "$file" 2>/dev/null | head -n 200
          }
          for log in inspect.log collect.log bundle.log prebuild.log android/gradle.log; do
            [ -f "$log" ] || continue
            echo "── $log: $(wc -l < "$log") lines ──"
            emit "$log — failure" "$(slice "$log" '(What went wrong|not a usable APK|produced no APK|Cannot|cannot|Unable|Error|error)' 3 14)"
            echo "::group::tail of $log"
            tail -45 "$log"
            echo "::endgroup::"
          done
